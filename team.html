<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>공정한 팀 나누기</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#FAF7F0;color:#1F2A37;min-height:100vh;user-select:none}
header{background:#1F2A37;color:#FAF7F0;padding:18px 28px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
h1{font-size:28px;font-weight:900;margin-right:auto}
button{font:inherit;font-weight:800;font-size:18px;padding:.5em 1.1em;border-radius:12px;cursor:pointer;border:2px solid #FAF7F0;background:transparent;color:#FAF7F0}
button.on{background:#FAF7F0;color:#1F2A37}
button.go{background:#E8664A;border-color:#E8664A;color:#fff;font-size:20px}
main{padding:20px 28px}
.help{font-size:15px;color:#6B7280;margin-bottom:12px}
.help b{display:inline-block;padding:1px 8px;border-radius:6px;color:#fff;font-size:13px;margin:0 2px}
#roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.st{background:#fff;border:2px solid #E6DFD0;border-radius:12px;padding:10px;text-align:center;cursor:pointer;font-weight:800;font-size:18px}
.st span{display:block;margin-top:4px;font-size:13px;color:#fff;border-radius:6px;padding:2px 0}
.L0 span{background:#1F2A37}.L1 span{background:#8A94A3}.L2 span{background:#C9A227}
#result{display:none;padding:20px 28px;gap:18px;grid-template-columns:repeat(var(--n),1fr)}
.team{border-radius:20px;padding:20px;color:#fff}
.team h2{font-size:clamp(28px,3.6vw,52px);font-weight:900;margin-bottom:10px}
.team p{font-size:clamp(22px,2.6vw,38px);font-weight:800;line-height:1.45}
.team small{font-size:.55em;opacity:.8;margin-left:6px}
</style></head><body>
<header><h1>공정한 팀 나누기</h1>
<span id="counts"><button data-n="2" class="on">2팀</button> <button data-n="3">3팀</button> <button data-n="4">4팀</button></span>
<button class="go" id="split">팀 나누기</button><button id="back" style="display:none">명단으로</button></header>
<main id="edit"><p class="help">학생 카드를 누를 때마다 <b style="background:#1F2A37">잘함</b><b style="background:#8A94A3">보통</b><b style="background:#C9A227">연습 중</b> 순서로 바뀝니다. 수준이 팀마다 고르게 섞입니다.</p>
<div id="roster"></div></main>
<section id="result"></section>
<script>
const LV=['잘함','보통','연습 중'],TC=['#1E6FD9','#E53935','#2E9E4F','#E0A100'],TN=['파랑 팀','빨강 팀','초록 팀','노랑 팀'];
const S=Array.from({length:24},(_,i)=>({name:'학생'+(i+1),lv:i%3===0?0:i%3===1?1:2}));
let nTeams=2;const $=id=>document.getElementById(id);
function draw(){$('roster').innerHTML=S.map((s,i)=>`<div class="st L${s.lv}" data-i="${i}">${s.name}<span>${LV[s.lv]}</span></div>`).join('');
 document.querySelectorAll('.st').forEach(d=>d.onclick=()=>{const s=S[+d.dataset.i];s.lv=(s.lv+1)%3;draw()})}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function split(){const teams=Array.from({length:nTeams},()=>[]);let start=Math.floor(Math.random()*nTeams);
 [0,1,2].forEach(lv=>{shuffle(S.filter(s=>s.lv===lv)).forEach(s=>{
  // 사람 수가 가장 적은 팀에, 같으면 돌아가며
  let best=-1;for(let k=0;k<nTeams;k++){const t=(start+k)%nTeams;if(best<0||teams[t].length<teams[best].length)best=t}
  teams[best].push(s);start=(best+1)%nTeams})});
 const r=$('result');r.style.setProperty('--n',nTeams);
 r.innerHTML=teams.map((t,i)=>`<div class="team" style="background:${TC[i]}"><h2>${TN[i]}<small>${t.length}명</small></h2><p>${t.map(s=>s.name).join('<br>')}</p></div>`).join('');
 $('edit').style.display='none';r.style.display='grid';$('back').style.display='inline-block';$('split').textContent='다시 나누기'}
document.querySelectorAll('#counts button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#counts button').forEach(x=>x.classList.remove('on'));b.classList.add('on');nTeams=+b.dataset.n;if($('result').style.display==='grid')split()});
$('split').onclick=split;
$('back').onclick=()=>{$('edit').style.display='block';$('result').style.display='none';$('back').style.display='none';$('split').textContent='팀 나누기'};
draw();
</script></body></html>
